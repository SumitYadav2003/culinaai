<!-- Light / dark theme switch. The label and icon are updated by theme_toggle.js -->
<button
  type="button"
  class="culina-theme-toggle"
  id="culinaThemeToggle"
  aria-label="Switch to dark mode"
  title="Switch theme"
>
  <i class="icon-moon" aria-hidden="true"></i>
  <span>Dark</span>
</button>
