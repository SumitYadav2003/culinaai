# Sends the Sunday emails and deletes old demo accounts, once a week.
#
# Render's free plan has no scheduled jobs, so GitHub runs this and calls the
# site's /tasks/weekly/ address with a secret. It needs two repository secrets
# (GitHub > Settings > Secrets and variables > Actions):
#   SITE_URL     e.g. https://culinaai.onrender.com   (no slash at the end)
#   CRON_SECRET  the same long random value as CRON_SECRET on Render
#
# You can also run it by hand: Actions > Weekly email > Run workflow.

name: Weekly email

on:
  schedule:
    # Sundays at 17:00 UTC (6 pm in the UK in summer, 5 pm in winter).
    - cron: "0 17 * * 0"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Call the weekly job on the site
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "SITE_URL or CRON_SECRET isn't set in the repository secrets, so there's nothing to do."
            exit 0
          fi
          # The free Render service may be asleep; the first request wakes it, so allow time and retries.
          curl --fail --silent --show-error \
            --retry 4 --retry-delay 30 --retry-all-errors --max-time 180 \
            -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SITE_URL/tasks/weekly/"
